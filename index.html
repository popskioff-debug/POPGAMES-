<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10152d">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<title>POPGAMES — Arcade 3D</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
:root{--bg:#0b1022;--panel:#151d38;--panel2:#1c2748;--text:#f5f7ff;--muted:#aab5d5;--accent:#7c5cff;--cyan:#43d9ff;--pink:#ff5da2;--green:#53e0a1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20285b 0,#0b1022 58%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{padding:26px 18px 20px;text-align:center;border-bottom:1px solid #ffffff15;background:#0b102288}
.logo{font-size:clamp(2rem,6vw,3.8rem);font-weight:1000;letter-spacing:2px;margin:0;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));background-clip:text;color:transparent}
header p{color:var(--muted);margin:7px 0 0}.wrap{max-width:1100px;margin:auto;padding:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
input,select,button{font:inherit}input,select{background:var(--panel);border:1px solid #ffffff22;color:var(--text);padding:11px 13px;border-radius:12px;min-width:0}
#search{flex:1;min-width:180px}.filters{display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:750;color:white;background:var(--accent);transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.13);transform:translateY(-1px)}button.secondary{background:#293456}button.good{background:#137e64}button.danger{background:#a93661}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:linear-gradient(145deg,#1a2444,#121a31);border:1px solid #ffffff12;border-radius:20px;padding:18px;min-height:160px;display:flex;flex-direction:column;box-shadow:0 12px 28px #0002}
.emoji{font-size:2.1rem}.card h3{margin:8px 0 4px}.card p{color:var(--muted);font-size:.92rem;margin:0 0 15px;flex:1}.card button{width:100%}
.panel{margin-top:18px;background:var(--panel);border:1px solid #ffffff1b;border-radius:22px;padding:20px;min-height:180px}
.panel h2{margin:0 0 8px}.muted{color:var(--muted)}.gamearea{margin-top:16px;text-align:center}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.board{display:grid;gap:6px;justify-content:center;margin:16px auto}.cell{background:var(--panel2);border:1px solid #ffffff18;border-radius:10px;display:grid;place-items:center;font-weight:900;min-width:0;user-select:none}.cell:disabled{cursor:default;transform:none}.tic{grid-template-columns:repeat(3, min(22vw,78px))}.tic .cell{height:min(22vw,78px);font-size:2rem}.mem{grid-template-columns:repeat(4,min(19vw,78px))}.mem .cell{height:min(19vw,78px);font-size:1.7rem}.grid2048{grid-template-columns:repeat(4,min(19vw,75px));background:#343e5c;padding:6px;border-radius:14px}.grid2048 .cell{height:min(19vw,75px);font-size:1.35rem;background:#26304b}.tile2{background:#dce6ff!important;color:#202849}.tile4{background:#a9c6ff!important;color:#202849}.tile8{background:#ffb66e!important;color:#442514}.tile16{background:#ff8d73!important}.tile32{background:#ff658d!important}.tile64{background:#d84c9b!important}.tilehi{background:#8b6bff!important}.choice{font-size:2rem;min-width:82px;background:#263254}.status{padding:10px;border-radius:12px;background:#ffffff0a;margin:12px auto;max-width:600px}.scoreline{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{background:#293456;padding:8px 12px;border-radius:99px;color:#dce4ff}.hidden{display:none}footer{text-align:center;color:var(--muted);padding:25px;font-size:.85rem}
@media(max-width:500px){.wrap{padding:13px}.panel{padding:14px}.card{min-height:145px}}
</style>
</head>
<body>
<header><h1 class="logo">🎮 POPGAMES</h1><p>Ton arcade de poche · 14 jeux · Gratuit et sans compte</p></header>
<main class="wrap">
<div class="toolbar"><input id="search" placeholder="🔎 Rechercher un jeu…" aria-label="Rechercher un jeu"><div class="filters"><button class="secondary" onclick="showAll()">Tous les jeux</button><button class="secondary" onclick="showFavorites()">⭐ Favoris</button></div></div>
<div id="cards" class="grid"></div>
<section id="play" class="panel hidden" aria-live="polite"><div class="row" style="justify-content:space-between"><button class="secondary" onclick="closeGame()">← Retour aux jeux</button><button class="secondary" onclick="resetGame()">↻ Recommencer</button></div><h2 id="gameTitle">Jeu</h2><p id="gameDesc" class="muted"></p><div id="gameArea" class="gamearea"></div></section>
</main><footer>POPGAMES · Amuse-toi, bats tes records et défie tes amis !</footer>
<script>
const games=[
{id:'memory',name:'Mémoire',emoji:'🧠',cat:'Réflexion',desc:'Retrouve les 8 paires avec le moins de coups.',fav:false},
{id:'tic',name:'Morpion',emoji:'❌',cat:'Réflexion',desc:'Aligne trois symboles avant l’ordinateur.',fav:false},
{id:'2048',name:'2048',emoji:'🔢',cat:'Réflexion',desc:'Fusionne les tuiles identiques pour atteindre 2048.',fav:false},
{id:'mole',name:'Tape-taupe',emoji:'🐹',cat:'Rapidité',desc:'Clique sur la taupe dès qu’elle apparaît en 20 secondes.',fav:false},
{id:'rps',name:'Pierre-feuille-ciseaux',emoji:'✊',cat:'Duel',desc:'Choisis ton coup et bats l’ordinateur.',fav:false},
{id:'guess',name:'Devine le nombre',emoji:'🎯',cat:'Réflexion',desc:'Trouve le nombre secret entre 1 et 100.',fav:false},
{id:'connect',name:'Puissance 4',emoji:'🔴',cat:'Duel',desc:'Aligne quatre jetons. Joue à deux sur le même écran.',fav:false},
{id:'snake',name:'Snake',emoji:'🐍',cat:'Rapidité',desc:'Mange les fruits et grandis sans toucher les murs.',fav:false},
{id:'reaction',name:'Test de réflexes',emoji:'⚡',cat:'Rapidité',desc:'Clique dès que la zone devient verte.',fav:false},
{id:'quiz',name:'Quiz express',emoji:'💡',cat:'Quiz',desc:'Réponds à 5 questions et teste tes connaissances.',fav:false},
{id:'math',name:'Calcul mental',emoji:'➕',cat:'Quiz',desc:'Résous autant de calculs que possible en 30 secondes.',fav:false},
{id:'clicker',name:'Clicker fou',emoji:'👆',cat:'Rapidité',desc:'Fais le plus de clics possible en 10 secondes.',fav:false},
{id:'war',name:'War Zone',emoji:'🚀',cat:'Action',desc:'Un jeu de guerre arcade animé : pilote ton vaisseau, évite les tirs et élimine les drones.',fav:false},
{id:'war3d',name:'Mission Strike 3D',emoji:'🪖',cat:'Action',desc:'Jeu de tir 3D avec soldat, ennemis, missions, santé et commandes tactiles.',fav:false}
];
let current=null, clean=()=>{}, favoriteSet=new Set(JSON.parse(localStorage.getItem('pop_favs')||'[]')), scores=JSON.parse(localStorage.getItem('pop_scores')||'{}'), filter='all';
function renderCards(){const q=document.querySelector('#search').value.toLowerCase();const list=games.filter(g=>(filter==='all'||favoriteSet.has(g.id))&&(g.name+' '+g.desc+' '+g.cat).toLowerCase().includes(q));document.querySelector('#cards').innerHTML=list.map(g=>`<article class="card"><div class="row" style="justify-content:space-between;margin:0"><span class="emoji">${g.emoji}</span><button class="secondary" title="Favori" aria-label="Favori ${g.name}" onclick="toggleFav('${g.id}')">${favoriteSet.has(g.id)?'⭐':'☆'}</button></div><h3>${g.name}</h3><p>${g.desc}<br><small>Meilleur score : ${scores[g.id]??'—'}</small></p><button onclick="launch('${g.id}')">Jouer maintenant ▶</button></article>`).join('')||'<p class="muted">Aucun jeu trouvé. Essaie un autre mot.</p>'}
function toggleFav(id){favoriteSet.has(id)?favoriteSet.delete(id):favoriteSet.add(id);localStorage.setItem('pop_favs',JSON.stringify([...favoriteSet]));renderCards()}
function showAll(){filter='all';renderCards()}function showFavorites(){filter='fav';renderCards()}
document.querySelector('#search').addEventListener('input',renderCards);
function launch(id){current=id;document.querySelector('#play').classList.remove('hidden');document.querySelector('#gameTitle').textContent=games.find(g=>g.id===id).emoji+' '+games.find(g=>g.id===id).name;document.querySelector('#gameDesc').textContent=games.find(g=>g.id===id).desc;document.querySelector('#play').scrollIntoView({behavior:'smooth',block:'start'});startGame()}
function closeGame(){clean();document.querySelector('#play').classList.add('hidden');current=null}
function resetGame(){if(current)startGame()}
function area(){return document.querySelector('#gameArea')}function say(t){const s=document.querySelector('#status');if(s)s.textContent=t}function status(t=''){return `<div id="status" class="status">${t}</div>`}
function saveScore(id,n,lower=false){let old=scores[id];if(old===undefined||(lower?n<old:n>old)){scores[id]=n;localStorage.setItem('pop_scores',JSON.stringify(scores))}renderCards()}
function startGame(){clean();clean=()=>{};const a=area();switch(current){
case'memory':memory(a);break;case'tic':tic(a);break;case'2048':game2048(a);break;case'mole':mole(a);break;case'rps':rps(a);break;case'guess':guess(a);break;case'connect':connect(a);break;case'snake':snake(a);break;case'reaction':reaction(a);break;case'quiz':quiz(a);break;case'math':mathGame(a);break;case'clicker':clicker(a);break;case'war':warGame(a);break;case'war3d':warGame3D(a);break}}
function memory(a){let vals=['🐶','🐱','🐸','🦊','🐼','🦁','🐵','🐧'];vals=[...vals,...vals].sort(()=>Math.random()-.5);let open=[],matched=new Set(),moves=0,lock=false;a.innerHTML=status('Coups : 0 · Paires : 0/8')+`<div class="board mem">${vals.map((v,i)=>`<button class="cell" data-i="${i}">?</button>`).join('')}</div>`;const update=()=>{a.querySelector('#status').textContent=`Coups : ${moves} · Paires : ${matched.size/2}/8`;};a.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(lock||matched.has(i)||open.includes(i))return;b.textContent=vals[i];open.push(i);if(open.length===2){moves++;lock=true;let [x,y]=open;if(vals[x]===vals[y]){matched.add(x);matched.add(y);open=[];lock=false;update();if(matched.size===16){say(`Bravo ! Toutes les paires en ${moves} coups.`);saveScore('memory',moves,true)}}else{update();setTimeout(()=>{[x,y].forEach(j=>a.querySelector(`[data-i="${j}"]`).textContent='?');open=[];lock=false},650)}}});clean=()=>{}}
function tic(a){let board=Array(9).fill(''),done=false,winLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];a.innerHTML=status('Tu joues X. À toi !')+`<div class="board tic">${board.map((_,i)=>`<button class="cell" data-i="${i}"></button>`).join('')}</div>`;function check(){for(const l of winLines)if(board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]])return board[l[0]];return board.every(Boolean)?'Nul':null}function end(r){done=true;say(r==='X'?'Tu as gagné ! 🎉':r==='O'?'L’ordinateur gagne. Réessaie !':'Match nul !');if(r==='X')saveScore('tic',(scores.tic||0)+1)}function draw(){a.querySelectorAll('[data-i]').forEach((b,i)=>{b.textContent=board[i];b.disabled=!!board[i]||done})}a.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(done||board[i])return;board[i]='X';draw();let r=check();if(r)return end(r);let empt=board.map((v,j)=>v?null:j).filter(v=>v!==null);let pick=empt.find(j=>winLines.some(l=>l.includes(j)&&l.filter(k=>board[k]==='O').length===2&&l.filter(k=>board[k]==='X').length===0));if(pick===undefined)pick=empt.find(j=>winLines.some(l=>l.includes(j)&&l.filter(k=>board[k]==='X').length===2&&l.filter(k=>board[k]==='O').length===0));if(pick===undefined)pick=empt[Math.floor(Math.random()*empt.length)];if(pick!==undefined)board[pick]='O';draw();r=check();if(r)end(r)});clean=()=>{}}
function game2048(a){let b=Array(16).fill(0),score=0,over=false;function add(){let e=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)b[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function draw(){a.innerHTML=status(`Score : ${score} · Record : ${scores['2048']||0}`)+`<div class="board grid2048">${b.map(v=>`<div class="cell ${v>=2&&v<=64?'tile'+v:v>=128?'tilehi':''}">${v||''}</div>`).join('')}</div><p class="muted">Utilise les flèches du clavier ou les boutons ci-dessous.</p><div class="row">${['←','↑','↓','→'].map((v,i)=>`<button class="secondary" onclick="window.__move2048(${i})">${v}</button>`).join('')}</div>`}function move(dir){if(over)return;let old=b.join(',');for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++){let r,c;if(dir===0){r=n;c=k}else if(dir===1){r=k;c=n}else if(dir===2){r=3-k;c=n}else{r=n;c=3-k}ids.push(r*4+c)}let vals=ids.map(i=>b[i]).filter(Boolean);for(let j=0;j<vals.length-1;j++)if(vals[j]===vals[j+1]){vals[j]*=2;score+=vals[j];vals.splice(j+1,1)}while(vals.length<4)vals.push(0);ids.forEach((id,j)=>b[id]=vals[j])}if(old!==b.join(',')){add();saveScore('2048',score);if(!b.some(v=>v<2048)&&!b.some((v,i)=>i%4<3&&v===b[i+1]||i<12&&v===b[i+4])){over=true;say('Partie terminée ! Recommence pour réessayer.')}draw()}}window.__move2048=move;add();add();draw();let key=e=>{let d={'ArrowLeft':0,'ArrowUp':1,'ArrowDown':2,'ArrowRight':3}[e.key];if(d!==undefined&&current==='2048'){e.preventDefault();move(d)}};window.addEventListener('keydown',key);let startX=0,startY=0;a.ontouchstart=e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY};a.ontouchend=e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?(dx>0?3:0):(dy>0?2:1))};clean=()=>{window.removeEventListener('keydown',key);a.ontouchstart=null;a.ontouchend=null;delete window.__move2048}}
function mole(a){let score=0,time=20,active=-1;a.innerHTML=status('Score : 0 · Temps : 20 s')+`<div class="board" style="grid-template-columns:repeat(3,min(25vw,90px))">${Array.from({length:9},(_,i)=>`<button class="cell" style="height:min(25vw,90px);font-size:2rem" data-i="${i}">·</button>`).join('')}</div>`;function draw(){a.querySelectorAll('[data-i]').forEach((b,i)=>b.textContent=i===active?'🐹':'·');say(`Score : ${score} · Temps : ${time} s`)}a.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(+b.dataset.i===active){score++;saveScore('mole',score);active=-1;draw()}});let tick=setInterval(()=>{time--;active=Math.floor(Math.random()*9);draw();if(time<=0){clearInterval(tick);active=-1;draw();say(`Terminé ! Ton score : ${score}`)}},800);draw();clean=()=>clearInterval(tick)}
function rps(a){let you=0,pc=0,streak=0;const choices=['Pierre ✊','Feuille ✋','Ciseaux ✌️'];a.innerHTML=status('Choisis ton coup !')+`<div class="row">${choices.map((c,i)=>`<button class="choice" onclick="window.__rps(${i})">${c}</button>`).join('')}</div><div id="rpsscore" class="scoreline"></div>`;window.__rps=i=>{let j=Math.floor(Math.random()*3),res=i===j?'Égalité !':(i-j+3)%3===1?'Tu gagnes !':'L’ordinateur gagne !';if(i!==j){if((i-j+3)%3===1){you++;streak++}else{pc++;streak=0}}say(`${choices[i]} contre ${choices[j]} — ${res}`);a.querySelector('#rpsscore').innerHTML=`<span class="pill">Toi : ${you}</span><span class="pill">Ordi : ${pc}</span><span class="pill">Série : ${streak}</span>`;saveScore('rps',streak)};clean=()=>delete window.__rps}
function guess(a){let secret=1+Math.floor(Math.random()*100),n=0;a.innerHTML=status('Je pense à un nombre entre 1 et 100.')+`<div class="row"><input id="guessN" type="number" min="1" max="100" placeholder="Ton nombre"><button id="guessB">Essayer</button></div>`;a.querySelector('#guessB').onclick=()=>{let v=+a.querySelector('#guessN').value;if(v<1||v>100||!Number.isInteger(v)){say('Entre un nombre entier de 1 à 100.');return}n++;if(v===secret){say(`Bravo ! Trouvé en ${n} essai(s) !`);saveScore('guess',n,true);a.querySelector('#guessB').disabled=true}else say(v<secret?`C’est plus grand ! Essais : ${n}`:`C’est plus petit ! Essais : ${n}`)};clean=()=>{}}
function connect(a){let b=Array(42).fill(''),turn='R',done=false;a.innerHTML=status('Joueur 🔴 commence. Jouez à deux !')+`<div class="board" style="grid-template-columns:repeat(7,min(11.5vw,48px))">${b.map((_,i)=>`<button class="cell" style="height:min(11.5vw,48px);border-radius:50%;font-size:1.2rem" data-i="${i}">⚪</button>`).join('')}</div>`;function check(i){let r=Math.floor(i/7),c=i%7;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let count=1;for(let s of [-1,1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&b[rr*7+cc]===turn){count++;rr+=dr*s;cc+=dc*s}}if(count>=4)return true}return false}function draw(){a.querySelectorAll('[data-i]').forEach((el,i)=>el.textContent=b[i]==='R'?'🔴':b[i]==='Y'?'🟡':'⚪')}a.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{if(done)return;let col=+el.dataset.i%7;let row=5;while(row>=0&&b[row*7+col])row--;if(row<0)return;let i=row*7+col;b[i]=turn;draw();if(check(i)){done=true;say(`Le joueur ${turn==='R'?'🔴 rouge':'🟡 jaune'} gagne !`);if(turn==='R')saveScore('connect',(scores.connect||0)+1)}else if(b.every(Boolean)){done=true;say('Match nul !')}else{turn=turn==='R'?'Y':'R';say(`Au tour du joueur ${turn==='R'?'🔴 rouge':'🟡 jaune'}.`)}});clean=()=>{}}
function snake(a){let pos=[42,41,40],dir=1,food=55,score=0,dead=false,tick;const size=100;function draw(){let cells=Array(100).fill('');pos.forEach(i=>cells[i]='🟩');cells[food]='🍎';a.innerHTML=status(`Score : ${score} · Utilise les flèches`) + `<div class="board" style="grid-template-columns:repeat(10,min(8vw,30px));gap:2px">${cells.map(v=>`<div class="cell" style="height:min(8vw,30px);font-size:.9rem;border-radius:4px">${v}</div>`).join('')}</div><p class="muted">${dead?'Partie terminée ! Appuie sur Recommencer.':''}</p>`}function step(){if(dead)return;let head=pos[0],r=Math.floor(head/10),c=head%10,nr=r+({0:-1,1:0,2:1,3:0}[dir]),nc=c+({0:0,1:1,2:0,3:-1}[dir]),next=nr*10+nc;if(nr<0||nr>=10||nc<0||nc>=10||(pos.includes(next)&&next!==pos[pos.length-1])){dead=true;clearInterval(tick);say(`Perdu ! Score : ${score}`);draw();return}pos.unshift(next);if(next===food){score++;saveScore('snake',score);let free=Array.from({length:100},(_,i)=>i).filter(i=>!pos.includes(i));food=free[Math.floor(Math.random()*free.length)]}else pos.pop();draw()}let key=e=>{let d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(d!==undefined&&current==='snake'){e.preventDefault();if((d+2)%4!==dir)dir=d}};window.addEventListener('keydown',key);a.innerHTML='';draw();tick=setInterval(step,220);clean=()=>{clearInterval(tick);window.removeEventListener('keydown',key)}}
function reaction(a){let state='wait',start=0,timer,attempts=0,best=null;a.innerHTML=status('Appuie sur Démarrer, puis clique dès que la zone devient verte.')+`<button id="react" style="width:min(100%,450px);height:180px;font-size:1.5rem;background:#34405f">Démarrer</button>`;let btn=a.querySelector('#react');btn.onclick=()=>{if(state==='wait'){state='ready';btn.style.background='#a93661';btn.textContent='Attends le vert…';timer=setTimeout(()=>{state='go';start=performance.now();btn.style.background='#137e64';btn.textContent='CLIQUE !'},1000+Math.random()*2500)}else if(state==='ready'){clearTimeout(timer);state='wait';btn.style.background='#34405f';btn.textContent='Trop tôt ! Recommence';say('Tu as cliqué trop tôt.');}else if(state==='go'){let ms=Math.round(performance.now()-start);attempts++;best=best===null?ms:Math.min(best,ms);state='wait';btn.style.background='#34405f';btn.textContent='Rejouer';say(`Réaction : ${ms} ms · Meilleur : ${best} ms`);saveScore('reaction',best,true)}};clean=()=>clearTimeout(timer)}
function quiz(a){let qs=[['Combien font 7 × 8 ?',['54','56','64'],1],['Quelle planète est surnommée la planète rouge ?',['Mars','Vénus','Jupiter'],0],['Combien de côtés a un hexagone ?',['5','6','8'],1],['Quel est le contraire de « rapide » ?',['Lent','Grand','Fort'],0],['Combien de minutes dans une heure ?',['100','30','60'],2],['Quel animal miaule ?',['Chien','Chat','Vache'],1],['Combien font 15 + 9 ?',['23','24','25'],1]];qs.sort(()=>Math.random()-.5);qs=qs.slice(0,5);let i=0,score=0;function draw(){if(i>=qs.length){a.innerHTML=`<div class="big">${score}/5 🏆</div><p>Quiz terminé !</p><button onclick="resetGame()">Rejouer</button>`;saveScore('quiz',score);return}let q=qs[i];a.innerHTML=status(`Question ${i+1}/5 · Score : ${score}`)+`<h3>${q[0]}</h3><div class="row" style="flex-direction:column;max-width:400px;margin:auto">${q[1].map((v,j)=>`<button class="secondary" data-j="${j}">${v}</button>`).join('')}</div>`;a.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(+b.dataset.j===q[2])score++;i++;draw()})}draw();clean=()=>{}}
function mathGame(a){let score=0,time=30,answer=0,over=false;function next(){let x=1+Math.floor(Math.random()*20),y=1+Math.floor(Math.random()*20),op=Math.random()<.5?'+':'−';if(op==='−'&&y>x)[x,y]=[y,x];answer=op==='+'?x+y:x-y;a.querySelector('#question').textContent=`${x} ${op} ${y} = ?`;a.querySelector('#ans').value=''}a.innerHTML=status('Score : 0 · Temps : 30 s')+`<h2 id="question"></h2><div class="row"><input id="ans" type="number" placeholder="Réponse"><button id="submitMath">Valider</button></div>`;a.querySelector('#submitMath').onclick=()=>{if(over)return;if(+a.querySelector('#ans').value===answer)score++;next();say(`Score : ${score} · Temps : ${time} s`)};next();let t=setInterval(()=>{time--;say(`Score : ${score} · Temps : ${time} s`);if(time<=0){clearInterval(t);over=true;a.querySelector('#submitMath').disabled=true;say(`Terminé ! Score final : ${score}`);saveScore('math',score)}},1000);clean=()=>clearInterval(t)}
function clicker(a){let n=0,time=10,over=false;a.innerHTML=status('Clics : 0 · Temps : 10 s')+`<button id="clickTarget" style="width:min(100%,420px);height:180px;font-size:1.5rem;background:linear-gradient(135deg,#7c5cff,#ff5da2)">CLIQUE ICI 👆</button>`;a.querySelector('#clickTarget').onclick=()=>{if(!over){n++;say(`Clics : ${n} · Temps : ${time} s`)}};let t=setInterval(()=>{time--;say(`Clics : ${n} · Temps : ${time} s`);if(time<=0){over=true;clearInterval(t);a.querySelector('#clickTarget').disabled=true;say(`Terminé ! ${n} clics !`);saveScore('clicker',n)}},1000);clean=()=>clearInterval(t)}

function warGame(a){
 let canvas,ctx,raf,keys={},last=0,player={x:0,y:0,w:30,h:28},shots=[],enemies=[],sparks=[],score=0,lives=3,spawn=0,over=false,paused=false;
 a.innerHTML=status('Mission : détruis les drones et évite leurs tirs.')+
 `<div class="scoreline"><span class="pill">Score : <b id="warScore">0</b></span><span class="pill">Vies : <b id="warLives">3</b></span><span class="pill">Niveau : <b id="warLevel">1</b></span></div>
 <canvas id="warCanvas" aria-label="Jeu de guerre spatial animé" style="display:block;width:100%;max-width:560px;height:auto;aspect-ratio:7/9;background:#070b1c;border:1px solid #52618f;border-radius:16px;margin:12px auto;touch-action:none"></canvas>
 <p class="muted">Déplace-toi avec ← → ou A/D, tire avec Espace. Sur téléphone, utilise les boutons.</p>
 <div class="row"><button class="secondary" id="warLeft">⬅️ Gauche</button><button id="warFire">🔥 Tirer</button><button class="secondary" id="warRight">Droite ➡️</button></div>
 <div class="row"><button class="secondary" id="warPause">⏸ Pause</button></div>`;
 canvas=a.querySelector('#warCanvas');ctx=canvas.getContext('2d');canvas.width=420;canvas.height=540;player.x=195;player.y=480;
 for(let i=0;i<55;i++)sparks.push({x:Math.random()*420,y:Math.random()*540,s:Math.random()*2+0.5,v:Math.random()*1.5+0.3});
 function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
 function ship(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#54e5ff';ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(15,13);ctx.lineTo(0,7);ctx.lineTo(-15,13);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7a59';ctx.fillRect(-5,13,4,7+Math.random()*6);ctx.fillRect(2,13,4,7+Math.random()*6);ctx.restore()}
 function drone(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.color;ctx.beginPath();ctx.moveTo(-13,-7);ctx.lineTo(-4,-12);ctx.lineTo(4,-12);ctx.lineTo(13,-7);ctx.lineTo(10,7);ctx.lineTo(0,11);ctx.lineTo(-10,7);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-6,-3,4,3);ctx.fillRect(3,-3,4,3);ctx.restore()}
 function update(t){if(over||paused)return;let dt=Math.min((t-last)/16||1,2);last=t;
   sparks.forEach(s=>{s.y+=s.v*dt;if(s.y>540){s.y=0;s.x=Math.random()*420}});
   if(keys.left)player.x-=4*dt;if(keys.right)player.x+=4*dt;player.x=Math.max(20,Math.min(400,player.x));
   shots.forEach(s=>s.y-=8*dt);shots=shots.filter(s=>s.y>-10);
   spawn+=dt;if(spawn>Math.max(18,48-score/8)){spawn=0;let level=1+Math.floor(score/100);enemies.push({x:22+Math.random()*376,y:-20,hp:level>3?2:1,v:1+Math.random()*1.1+level*.12,color:['#ff5da2','#ffba5a','#a28bff'][Math.floor(Math.random()*3)],fire:Math.random()*100})}
   enemies.forEach(e=>{e.y+=e.v*dt;e.fire-=dt;if(e.fire<0){e.fire=90+Math.random()*100;e.bullet={x:e.x,y:e.y+12}}});
   let enemyShots=enemies.filter(e=>e.bullet).map(e=>e.bullet);enemyShots.forEach(b=>b.y+=3.2*dt);
   for(let s of shots){for(let e of enemies){if(!e.dead&&Math.abs(s.x-e.x)<16&&Math.abs(s.y-e.y)<16){s.dead=true;e.hp--;if(e.hp<=0){e.dead=true;score+=10}}}}
   for(let e of enemies){if(e.bullet&&!e.bullet.dead&&Math.abs(e.bullet.x-player.x)<17&&Math.abs(e.bullet.y-player.y)<18){e.bullet.dead=true;lives--;if(lives<=0)finish()}}
   enemies.forEach(e=>{if(e.y>530&&!e.dead){e.dead=true;lives--;if(lives<=0)finish()}});
   shots=shots.filter(s=>!s.dead);enemies=enemies.filter(e=>!e.dead);enemies.forEach(e=>{if(e.bullet&&e.bullet.dead)e.bullet=null});
   a.querySelector('#warScore').textContent=score;a.querySelector('#warLives').textContent='❤️'.repeat(Math.max(0,lives));a.querySelector('#warLevel').textContent=1+Math.floor(score/100);
   draw();if(!over)raf=requestAnimationFrame(update)
 }
 function draw(){ctx.clearRect(0,0,420,540);let g=ctx.createLinearGradient(0,0,420,540);g.addColorStop(0,'#101b42');g.addColorStop(1,'#080b1b');ctx.fillStyle=g;ctx.fillRect(0,0,420,540);ctx.fillStyle='#ffffff';sparks.forEach(s=>ctx.fillRect(s.x,s.y,s.s,s.s));ctx.strokeStyle='#1e3d68';ctx.globalAlpha=.25;for(let y=0;y<540;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(420,y);ctx.stroke()}ctx.globalAlpha=1;shots.forEach(s=>{ctx.fillStyle='#61f5ff';ctx.fillRect(s.x-2,s.y-8,4,12);ctx.fillStyle='#fff';ctx.fillRect(s.x-1,s.y-8,2,5)});enemies.forEach(e=>{drone(e);if(e.bullet){ctx.fillStyle='#ff587d';ctx.beginPath();ctx.arc(e.bullet.x,e.bullet.y,4,0,7);ctx.fill()}});ship(player.x,player.y);if(paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,420,540);ctx.fillStyle='#fff';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText('PAUSE',210,270)}}
 function finish(){over=true;cancelAnimationFrame(raf);say(`Mission terminée ! Score : ${score}. Appuie sur Recommencer pour rejouer.`);saveScore('war',score)}
 function shoot(){if(!over&&!paused)shots.push({x:player.x,y:player.y-18})}
 function keydown(e){if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' ')shoot()}

 const hold=(id,k)=>{let b=a.querySelector(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false};

 a.querySelector('#warPause').onclick=()=>{paused=!paused;a.querySelector('#warPause').textContent=paused?'▶️ Reprendre':'⏸ Pause';if(paused){cancelAnimationFrame(raf);draw()}else{last=performance.now();raf=requestAnimationFrame(update)}};
 clean=()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',keydown);window.removeEventListener('keyup',keyup);keys={}};
 raf=requestAnimationFrame(update);
}

 scene=new T.Scene();scene.background=new T.Color(0x8ca2b4);scene.fog=new T.Fog(0x8ca2b4,22,90);
 camera=new T.PerspectiveCamera(72,1,0.1,120);camera.position.set(0,1.65,6);camera.rotation.order='YXZ';

 for(let i=0;i<22;i++){let x=(Math.random()-.5)*38,z=-Math.random()*42-3;let w=1+Math.random()*2.2,h=.7+Math.random()*1.7;let m=new T.Mesh(new T.BoxGeometry(w,h,.8),i%3?matWall:matDark);m.position.set(x,h/2,z);m.rotation.y=Math.random()*Math.PI;m.castShadow=true;m.receiveShadow=true;scene.add(m)}
 for(let i=0;i<75;i++){let mark=new T.Mesh(new T.BoxGeometry(.035,.01,1+Math.random()*2),new T.MeshStandardMaterial({color:i%2?0x8c8b6c:0x505d4c}));mark.position.set((Math.random()-.5)*45,.005,-Math.random()*50);mark.rotation.y=Math.random()*Math.PI;scene.add(mark)}
 // Player rifle visible in lower right, made from simple 3D parts
 const gun=new T.Group();const gunMat=new T.MeshStandardMaterial({color:0x222a2b,metalness:.45,roughness:.45});let barrel=new T.Mesh(new T.BoxGeometry(.11,.12,.9),gunMat);barrel.position.set(.35,-.25,-.65);gun.add(barrel);let stock=new T.Mesh(new T.BoxGeometry(.16,.2,.35),new T.MeshStandardMaterial({color:0x5b4a35}));stock.position.set(.35,-.33,-.25);gun.add(stock);let sight=new T.Mesh(new T.BoxGeometry(.05,.05,.12),gunMat);sight.position.set(.35,-.16,-.56);gun.add(sight);camera.add(gun);scene.add(camera);
 function soldier(x,z,enemy=true){let g=new T.Group();let cloth=new T.MeshStandardMaterial({color:enemy?0x9d3434:0x3e5845,roughness:.9}),pants=new T.MeshStandardMaterial({color:0x343d39}),skin=new T.MeshStandardMaterial({color:0x9b765c}),helmet=new T.MeshStandardMaterial({color:enemy?0x592d2c:0x293d30});function part(geo,mat,pos){let m=new T.Mesh(geo,mat);m.position.set(...pos);m.castShadow=true;g.add(m);return m}part(new T.BoxGeometry(.52,.72,.3),cloth,[0,1.15,0]);part(new T.SphereGeometry(.2,12,10),skin,[0,1.68,0]);part(new T.SphereGeometry(.23,12,8),helmet,[0,1.79,0]);part(new T.BoxGeometry(.18,.42,.2),pants,[-.14,.57,0]);part(new T.BoxGeometry(.18,.42,.2),pants,[.14,.57,0]);part(new T.BoxGeometry(.15,.5,.15),cloth,[-.36,1.18,0]);part(new T.BoxGeometry(.15,.5,.15),cloth,[.36,1.18,0]);let rifle=part(new T.BoxGeometry(.12,.12,.8),gunMat,[.27,1.15,-.35]);g.position.set(x,0,z);scene.add(g);return {g,hp:1,fire:Math.random()*2,alive:true}}

 function shoot(){if(ended||paused)return;let now=performance.now();if(now-lastShot<260)return;lastShot=now;const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(0,0),camera);let objects=enemies.filter(e=>e.alive).map(e=>e.g);let hits=ray.intersectObjects(objects,true);if(hits.length){let root=hits[0].object;let e=enemies.find(en=>en.alive&&en.g.getObjectById(root.id));if(!e)e=enemies.find(en=>en.alive&&root.parent===en.g);if(e){e.alive=false;scene.remove(e.g);score+=100;a.querySelector('#s3').textContent=score;let left=enemies.filter(en=>en.alive).length;let target=4+mission;a.querySelector('#e3').textContent=`${target-left}/${target}`;if(left===0){mission++;a.querySelector('#m3').textContent=mission;setTimeout(()=>{if(!ended){spawnMission()}},900)}}}
 // tiny muzzle flash

 }
 function update(t){if(ended||paused)return;let dt=Math.min((t-(update.last||t))/1000,.05);update.last=t;let speed=5*dt;let f=(keys.forward?1:0)-(keys.back?1:0),s=(keys.right?1:0)-(keys.left?1:0);player.x+=Math.cos(player.yaw)*s*speed+Math.sin(player.yaw)*f*speed;player.z+=Math.sin(player.yaw)*s*speed-Math.cos(player.yaw)*f*speed;player.x=Math.max(-22,Math.min(22,player.x));player.z=Math.max(-40,Math.min(10,player.z));camera.position.set(player.x,1.65,player.z);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');gun.position.x=Math.sin(t/240)*.006;enemies.forEach(e=>{if(!e.alive)return;e.fire-=dt;if(e.fire<0){e.fire=1.4+Math.random()*1.8;let dist=Math.hypot(e.g.position.x-player.x,e.g.position.z-player.z);if(dist<24&&Math.random()<.65){health-=8;a.querySelector('#h3').textContent=Math.max(0,health)+'%';say('Tu es touché ! Mets-toi à couvert.');if(health<=0){ended=true;cancelAnimationFrame(raf);say(`Mission échouée. Score : ${score}. Appuie sur Recommencer pour rejouer.`);saveScore('war3d',score)}}}});renderer.render(scene,camera);if(!ended)raf=requestAnimationFrame(update)}
